<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overview Project</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><a class="brand" href="#">◈ <span>overview<span class="muted"> / project</span></span></a><div class="project" id="project">Loading project…</div><div class="status" id="status" role="status">Connecting</div><a id="export" class="button" href="/export.html" download>↓ Export HTML</a></header>
<section class="summary"><div><div class="eyebrow">YOUR CODE, CONNECTED</div><h1>프로젝트를 한눈에.</h1><p>구조를 펼치고, 연결을 따라가세요.</p></div><div id="metrics" class="metrics"></div></section>
<main>
<aside class="explorer"><div class="pane-title">EXPLORER <span id="file-count"></span></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="파일 · 함수 · 클래스 검색" aria-label="노드 검색"></label><div id="tree" class="tree"></div><div class="explorer-footer">● Local analysis<br><small>소스 코드를 실행하지 않습니다.</small></div></aside>
<section class="workspace"><div class="toolbar"><div class="tabs" role="group" aria-label="보기 모드"><button data-mode="files" class="active">파일 구조</button><button data-mode="symbols">코드 연결</button><button data-mode="tests">테스트</button><button data-mode="styles">스타일</button></div><select id="history" aria-label="분석 버전"><option value="live">현재 버전 · Live</option></select></div><div class="subtoolbar"><label>연결 <select id="relation" aria-label="관계 필터"><option value="all">모든 관계</option><option value="imports">imports</option><option value="calls">calls</option><option value="inherits">inherits</option><option value="reads">reads</option><option value="writes">writes</option><option value="renders">renders</option><option value="tests">tests</option><option value="styles">styles</option></select></label><button id="focus">선택 노드 주변만</button><button id="reset">전체 보기</button><span id="graph-count"></span></div><div class="canvas" id="canvas"><svg id="graph" role="img" aria-label="코드 관계 그래프"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8895a5"/></marker></defs><g id="scene"></g></svg><div id="empty" hidden>표시할 노드가 없습니다. 검색어나 필터를 바꿔보세요.</div><div class="zoom"><button id="zoom-out" aria-label="축소">−</button><button id="fit">Fit</button><button id="zoom-in" aria-label="확대">+</button></div><div class="legend"><span class="dot blue"></span>구조 <span class="dot teal"></span>함수 <span class="dot purple"></span>테스트 <span class="dashed"></span>추정 관계</div></div><footer class="changes" id="changes"></footer></section>
<aside class="inspector"><div class="pane-title">INSPECTOR</div><div id="details"><div class="placeholder">↖<h2>연결을 탐색하세요</h2><p>노드를 선택하면 정의 위치,<br>호출 관계와 코드를 볼 수 있어요.</p></div></div></aside>
</main><details class="diagnostics"><summary id="diagnostic-title">분석 범위 및 알림</summary><div id="diagnostic-body"></div></details>
<script src="/app.js" defer></script>
</body></html>
